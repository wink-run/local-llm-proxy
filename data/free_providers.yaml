# 板块② Layer 1：免费 Provider 目录
# 字段说明见 DESIGN_v2.md §2.3
# 修改 yaml 后重启本地网关生效；用户私人覆盖请放 ~/.local-llm-proxy/free_providers.user.yaml

providers:
  - id: ollama
    display: "本地 Ollama"
    tier: free
    base_url: "http://127.0.0.1:11434/v1"
    auth: { type: "none" }
    protocol: openai
    signup_url: "https://ollama.com/download"
    guide_md: "guides/free/ollama.md"
    models: []           # 用户机器上 ollama list 决定
    quota_hint: "无限（本地推理）"
    notes: "不需要 API key；模型由本机 Ollama 服务提供。"

  - id: groq
    display: "Groq Cloud"
    tier: free
    base_url: "https://api.groq.com/openai/v1"
    auth: { type: "bearer", env: "GROQ_API_KEY" }
    protocol: openai
    signup_url: "https://console.groq.com/keys"
    guide_md: "guides/free/groq.md"
    models:
      - "llama-4-70b-instruct"
      - "llama-4-8b-instant"
      - "llama-3.3-70b-versatile"
      - "qwen-3-32b"
      - "kimi-k2"
    quota_hint: "免费档 RPM 30 / TPM 6k · 主推 Llama 4 + Qwen 3"

  - id: cerebras
    display: "Cerebras Cloud"
    tier: free
    base_url: "https://api.cerebras.ai/v1"
    auth: { type: "bearer", env: "CEREBRAS_API_KEY" }
    protocol: openai
    signup_url: "https://cloud.cerebras.ai/platform/"
    guide_md: "guides/free/cerebras.md"
    models:
      - "llama-4-70b"
      - "llama-4-8b"
      - "qwen-3-32b"
      - "llama-3.3-70b"
    quota_hint: "免费档每日 1M tokens · 推理速度全球最快"

  - id: gemini-ai-studio
    display: "Google AI Studio (OpenAI 兼容端点)"
    tier: free
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    auth: { type: "bearer", env: "GEMINI_API_KEY" }
    protocol: openai             # 走 Google 的 OpenAI 兼容端点
    signup_url: "https://aistudio.google.com/apikey"
    guide_md: "guides/free/gemini.md"
    models:
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"
      - "gemini-2.5-flash-lite"
    quota_hint: "免费档 RPM 15 / TPM 1M / 1500 RPD · 2.5 Pro 含 2M 上下文"

  - id: gemini-native
    display: "Google Gemini（原生 generateContent）"
    tier: free
    base_url: "https://generativelanguage.googleapis.com"
    auth: { type: "bearer", env: "GEMINI_API_KEY" }
    protocol: gemini_native      # 网关自动 OpenAI Chat ⇆ Gemini 互转
    signup_url: "https://aistudio.google.com/apikey"
    guide_md: "guides/free/gemini.md"
    models:
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"
      - "gemini-2.5-flash-lite"
    quota_hint: "等同 AI Studio 但走原生端点；客户端可用 OpenAI 兼容调用"
    notes: "适用于需要 systemInstruction / safetySettings 等 native 字段的场景"

  - id: openrouter-free
    display: "OpenRouter（免费模型）"
    tier: free
    base_url: "https://openrouter.ai/api/v1"
    auth: { type: "bearer", env: "OPENROUTER_API_KEY" }
    protocol: openai
    signup_url: "https://openrouter.ai/settings/keys"
    guide_md: "guides/free/openrouter.md"
    models:
      - "meta-llama/llama-4-70b-instruct:free"
      - "deepseek/deepseek-r1:free"
      - "deepseek/deepseek-v3:free"
      - "qwen/qwen3-72b-instruct:free"
      - "google/gemini-2.5-flash-exp:free"
    quota_hint: "免费 RPD 50 / 含 :free 后缀模型免费"
    notes: "调用时模型名必须含 :free 后缀，否则会按付费计费。"

  - id: github-models
    display: "GitHub Models"
    tier: free
    base_url: "https://models.inference.ai.azure.com"
    auth: { type: "bearer", env: "GITHUB_PAT" }
    protocol: openai
    signup_url: "https://github.com/settings/tokens?type=beta"
    guide_md: "guides/free/github-models.md"
    models:
      - "gpt-5.5"
      - "gpt-5.5-mini"
      - "gpt-5.5-instant"
      - "Meta-Llama-4-405B-Instruct"
      - "Phi-4"
      - "DeepSeek-R1"
    quota_hint: "免费调用 GPT-5.5 / Llama 4 / DeepSeek-R1，需 GitHub PAT"
    setup_steps:
      - { id: "login", label: "登录 GitHub 账号", auto: true }
      - { id: "create_pat", label: "创建 Personal Access Token", action: "open_url", url: "https://github.com/settings/tokens?type=beta" }
      - { id: "test", label: "验证并启用", action: "test_and_enable" }

  - id: siliconflow
    display: "SiliconFlow"
    tier: free
    base_url: "https://api.siliconflow.cn/v1"
    auth: { type: "bearer", env: "SILICONFLOW_API_KEY" }
    protocol: openai
    signup_url: "https://cloud.siliconflow.cn/i/drGuwc9k"
    guide_md: "guides/free/siliconflow.md"
    models:
      - "Qwen/Qwen3-8B-Instruct"
      - "Qwen/Qwen3-Coder-30B-Instruct"
      - "deepseek-ai/DeepSeek-V3.1"
      - "deepseek-ai/DeepSeek-R1"
      - "01-ai/Yi-2-9B-Chat-32K"
    quota_hint: "国内免费供应商，支持 Qwen 3 / DeepSeek V3.1 / R1，新人 ¥16 赠送"
    new_user_bonus: true
    bonus_value: "新人 ¥16"

  - id: nvidia-nim
    display: "NVIDIA NIM"
    tier: free
    base_url: "https://integrate.api.nvidia.com/v1"
    auth: { type: "bearer", env: "NVIDIA_API_KEY" }
    protocol: openai
    signup_url: "https://build.nvidia.com"
    guide_md: "guides/free/nvidia.md"
    models:
      - "meta/llama-4-405b-instruct"
      - "meta/llama-4-70b-instruct"
      - "deepseek-ai/deepseek-r1"
      - "deepseek-ai/deepseek-v3"
      - "qwen/qwen3-coder-32b-instruct"
      - "nvidia/nemotron-4-340b-instruct"
    quota_hint: "新用户开发免费，含 Llama 4 / DeepSeek R1 / Nemotron 等旗舰"
    new_user_bonus: true
    bonus_value: "新人 1000 次免费调用"

  - id: sambanova
    display: "SambaNova Cloud"
    tier: free
    base_url: "https://api.sambanova.ai/v1"
    auth: { type: "bearer", env: "SAMBANOVA_API_KEY" }
    protocol: openai
    signup_url: "https://cloud.sambanova.ai"
    guide_md: "guides/free/sambanova.md"
    models:
      - "Meta-Llama-4-405B-Instruct"
      - "Meta-Llama-4-70B-Instruct"
      - "DeepSeek-R1"
      - "Qwen3-32B"
    quota_hint: "免费档极速推理；Llama 4 405B 公开访问"

  - id: cohere
    display: "Cohere"
    tier: free
    base_url: "https://api.cohere.ai/compatibility/v1"
    auth: { type: "bearer", env: "COHERE_API_KEY" }
    protocol: openai
    signup_url: "https://dashboard.cohere.com/api-keys"
    guide_md: "guides/free/cohere.md"
    models:
      - "command-r-plus-08-2024"
      - "command-r-08-2024"
      - "command-light"
    quota_hint: "Trial key 免费档：1000 调用/月，速率 20 RPM"
    new_user_bonus: true
    bonus_value: "Trial Key 1000 调用/月"

  - id: cloudflare-workers-ai
    display: "Cloudflare Workers AI"
    tier: free
    base_url: "https://api.cloudflare.com/client/v4/accounts/{ACCOUNT_ID}/ai/v1"
    auth: { type: "bearer", env: "CLOUDFLARE_API_TOKEN" }
    protocol: openai
    signup_url: "https://dash.cloudflare.com/profile/api-tokens"
    guide_md: "guides/free/cloudflare.md"
    requires_account_id: true
    models:
      - "@cf/meta/llama-4-8b-instruct"
      - "@cf/qwen/qwen3-7b-instruct"
      - "@cf/deepseek-ai/deepseek-coder-6.7b-instruct"
    quota_hint: "免费档 10K 次/天；需 Cloudflare Account ID + API Token"
    notes: "添加时需填 Cloudflare Account ID（在 dash.cloudflare.com 右下角）"

  - id: mistral
    display: "Mistral AI"
    tier: free
    base_url: "https://api.mistral.ai/v1"
    auth: { type: "bearer", env: "MISTRAL_API_KEY" }
    protocol: openai
    signup_url: "https://console.mistral.ai/api-keys"
    guide_md: "guides/free/mistral.md"
    models:
      - "mistral-large-latest"
      - "mistral-small-latest"
      - "open-mixtral-8x22b"
      - "codestral-latest"
    quota_hint: "免费档 1 RPS / 500K tokens 每月（codestral 单独 30 RPS）"
