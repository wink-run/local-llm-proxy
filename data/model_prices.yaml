# Model 折算价格 —— 用于 Dashboard「今日节省」估值。
# 单位：USD per 1M tokens (input / output)
#
# 节省算法（in server/dashboard.py）：
#   savings = tokens * paid_equivalent_price (when tier != paid)
# 也就是：「如果这条请求走 paid，会花多少」
#
# 一个模型只列一份价格（按 paid 价）。同名模型在免费源 (Groq/GitHub Models 免费档等)
# 上调用时按 call_log.tier 区分，免费的 actual_cost = 0，但 paid_equivalent 仍按这里查。
# 缺失模型按 defaults.paid_default 走。

defaults:
  paid_default: { input: 0.5, output: 1.5 }    # 未知模型按 mini 级别估
  free_default: { input: 0.0, output: 0.0 }

models:
  # OpenAI
  "gpt-5.5":          { input: 5.0,  output: 15.0 }
  "gpt-5.5-pro":      { input: 15.0, output: 60.0 }
  "gpt-5.5-mini":     { input: 0.15, output: 0.6  }
  "gpt-5.5-instant":  { input: 0.05, output: 0.2  }

  # Anthropic
  "claude-opus-4-7":     { input: 15.0, output: 75.0 }
  "claude-sonnet-4-6":   { input: 3.0,  output: 15.0 }
  "claude-haiku-4-5":    { input: 0.8,  output: 4.0  }

  # Google Gemini
  "gemini-2.5-pro":        { input: 1.25,  output: 5.0  }
  "gemini-2.5-flash":      { input: 0.075, output: 0.3  }
  "gemini-2.5-flash-lite": { input: 0.04,  output: 0.15 }

  # DeepSeek
  "deepseek-chat":             { input: 0.27, output: 1.1 }
  "deepseek-reasoner":         { input: 0.55, output: 2.2 }
  "deepseek-ai/DeepSeek-V3.1": { input: 0.27, output: 1.1 }
  "deepseek-ai/DeepSeek-R1":   { input: 0.55, output: 2.2 }
  "DeepSeek-R1":               { input: 0.55, output: 2.2 }   # GitHub Models 名

  # 智谱
  "glm-5.1": { input: 0.5,  output: 1.5  }
  "glm-5":   { input: 0.3,  output: 1.0  }
  "glm-4.7": { input: 0.15, output: 0.5  }

  # Moonshot
  "kimi-k2":          { input: 0.7,  output: 2.0  }
  "kimi-k1.5":        { input: 0.3,  output: 1.0  }
  "moonshot-v1-128k": { input: 0.5,  output: 1.5  }

  # xAI
  "grok-4":      { input: 5.0,  output: 15.0 }
  "grok-4-mini": { input: 0.3,  output: 1.0  }

  # Qwen
  "Qwen/Qwen3-8B-Instruct":          { input: 0.05, output: 0.2 }
  "Qwen/Qwen3-Coder-30B-Instruct":   { input: 0.15, output: 0.5 }
  "qwen-3-32b":                      { input: 0.18, output: 0.6 }
  "qwen/qwen3-72b-instruct:free":    { input: 0.25, output: 1.0 }

  # Meta Llama (paid via providers like Together / DeepInfra; here is reference)
  "Meta-Llama-4-405B-Instruct":      { input: 0.9,  output: 2.7 }
  "llama-4-70b-instruct":            { input: 0.4,  output: 1.2 }
  "llama-4-8b-instant":              { input: 0.04, output: 0.12 }
  "llama-3.3-70b-versatile":         { input: 0.4,  output: 1.2 }

  # Microsoft Phi
  "Phi-4": { input: 0.1, output: 0.3 }
