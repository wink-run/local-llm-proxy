version: 1
category_groups:
  tokenbank: Token Bank 内置
  official: 官方参考（维护中）
  filesystem: 文件与代码
  web: 网络与搜索
  database: 数据库
  browser: 浏览器自动化
  collaboration: 协作与 SaaS
