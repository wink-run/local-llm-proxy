- catalog_id: filesystem
  id: mcp-filesystem
  name: filesystem
  display_name: Filesystem
  description: 读写本地文件、列目录、搜索（官方维护）
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-filesystem'
  env: {}
  metadata:
    category: filesystem
    categoryGroup: official
    icon: 📁
    tools:
    - read_file
    - write_file
    - list_directory
    - search_files
    - get_file_info
    package: '@modelcontextprotocol/server-filesystem'
    tags:
    - 官方
    - 文件
  config_fields:
  - key: allowedDir
    label: 允许访问目录
    type: path
    defaultValue: /Users/ully
    appendArg: true
  always_installed: false
