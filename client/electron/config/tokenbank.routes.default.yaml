# tokenbank.routes.default.yaml
# 场景路由默认配置 — 程序内置，首次初始化时加载到 local-config.scene_routes。
# 用户通过「导入配置」（本地文件或服务器下发）覆盖后，此文件不再使用。
# 格式与 tokenbank.tools.default.yaml 相同（统一 schema），各取所需的段。

version: 1

# ════════ 虚拟模型映射 ════════
# 虚拟模型名（对外）→ 真实模型名（对内 P2P）
# Claude Desktop / Claude Code 校验强制 Anthropic 模型名，故需映射 →（网关改写）→ 真实 P2P 模型
# 注意：必须覆盖客户端实际发送的所有模型名，否则未映射的模型路由失败会显示 "server is busy"
# 与场景路由同属「路由」范畴，统一放在此文件，下发后作为初始值写入 local-config（用户可编辑）。
virtual_models:
  - id: claude-opus-4-8
    display_name: Claude Opus 4.8
    real_model: glm-4.7
    description: Maps to GLM-4.7 backend

  - id: claude-sonnet-4-5
    display_name: Claude Sonnet 4.5
    real_model: glm-4.7
    description: Maps to GLM-4.7 backend

  - id: claude-haiku-4-5
    display_name: Claude Haiku 4.5
    real_model: glm-4.5-flash
    description: Maps to GLM-4.5-Flash backend (fast/background tasks)

  - id: claude-opus-4
    display_name: Claude Opus 4
    real_model: glm-4.7
    description: Maps to GLM-4.7 backend


# ── 默认场景路由 ──────────────────────────────────────────────────────────────
# 每条路由对应一个降级链：按 steps 顺序依次尝试，失败自动降到下一个。
# 客户端使用 model_key（如 llm-router-xxxxxx）触发对应路由。
# steps[].model 应填写已在供给源中启用的模型名称。

scene_routes:
  - id: route-code
    scene_name: 代码助手
    icon: 💻
    model_key: llm-router-code
    steps:
      - model: claude-opus-4-8
        tier: paid
      - model: gpt-4o
        tier: paid
      - model: deepseek-v3
        tier: paid

  - id: route-chat
    scene_name: 日常对话
    icon: 💬
    model_key: llm-router-chat
    steps:
      - model: deepseek-v3
        tier: paid
      - model: gpt-4o-mini
        tier: paid

  - id: route-long
    scene_name: 长上下文
    icon: 📄
    model_key: llm-router-long
    steps:
      - model: claude-opus-4-8
        tier: paid
      - model: gpt-4o
        tier: paid

  - id: route-fast
    scene_name: 快速响应
    icon: ⚡
    model_key: llm-router-fast
    steps:
      - model: claude-haiku-4-5
        tier: paid
      - model: gpt-4o-mini
        tier: paid
      - model: deepseek-v3
        tier: free
