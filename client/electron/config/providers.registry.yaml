# providers.registry.yaml — 供给源唯一配置表（server + client 同步）
# 改此文件后同步到 server/static/defaults/providers.registry.yaml

version: 1

providers:
- id: ollama
  label: Ollama
  icon: 🦙
  tier: free
  hint: 自动检测本地实例，无需配置
  base_url: http://127.0.0.1:11434/v1
  modalities:
    language: true
  models: []
  pricing: {}
  handler: local
  api_format: openai
  enabled_default: true
  keyless: true
  key_prefix: []
  signup_url: https://ollama.com/download
  payg: true
- id: nvidia
  label: NVIDIA NIM
  icon: 🟢
  tier: free
  hint: 新用户免费额度：build.nvidia.com
