# tokenbank.tools.default.yaml
# 工具清单默认配置 — 程序内置，首次初始化时加载到 config-loader。
# 用户通过「导入配置」（本地文件或服务器下发）覆盖后，此文件不再使用。
# 格式与 tokenbank.routes.default.yaml 相同（统一 schema），各取所需的段。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口；占位符 {REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口；占位符 {MITM}=host:mitm_port

mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA

# ── 支持的 CLI 工具（接入方式 + 检测方式）──────────────────────────────────────
tools:
  - id: claude-code
    name: Claude Code
    protocol: anthropic
    detect:
      command: claude
      version-arg: --version
      config-dirs: ['$CLAUDE_CONFIG_DIR', '~/.claude']
    strategy: base_url-env
    inject:
      env:
        ANTHROPIC_BASE_URL: http://{REVERSE}

  - id: codex
    name: Codex (CLI)
    protocol: responses
    detect:
      command: codex
      version-arg: --version
    strategy: config-file
    config-file: '{CODEX_HOME|~/.codex}/config.toml'
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.base_url: http://{REVERSE}/v1
      model_providers.tokenbank.wire_api: responses
    revert: state-precise

  - id: gemini-cli
    name: Gemini CLI
    protocol: gemini
    detect:
      command: gemini
      version-arg: --version
      config-dirs: ['~/.gemini']
    strategy: base_url-env
    inject:
      env:
        GEMINI_BASE_URL: http://{REVERSE}

  # ── 桌面 GUI 应用（Electron/Chromium）：走系统代理 + 系统信任库 ──
  # needs_ca=true：必须先把根 CA 装进系统信任库才能托管（MITM）
  - id: claude-desktop
    name: Claude Desktop
    protocol: anthropic
    type: gui
    needs_ca: true
    detect:
      appx: Claude
    strategy: mitm-system
    mitm-domains: [api.anthropic.com, a-api.anthropic.com, claude.ai]

  - id: codex-desktop
    name: Codex Desktop
    protocol: responses
    type: gui
    needs_ca: true
    detect:
      appx: OpenAI.Codex
    strategy: mitm-system
    mitm-domains: [chatgpt.com, ab.chatgpt.com, ws.chatgpt.com, chat.openai.com, api.openai.com]
    note: 需实测证书（桌面端可能存在证书锁定）
