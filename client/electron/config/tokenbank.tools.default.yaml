# tokenbank.tools.default.yaml
# 工具清单默认配置 —— 内置「留空」：应用均从服务器同步下发。
# 仅保留网关基础设施。配置查看器在未导入任何配置时展示此文件。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430
  mitm_port: 8888

mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}
    - auto

# Claude 客户端模型名（内部透明：仅供 /v1/models 暴露 + 标记 Claude 请求；真实模型来自应用绑定）
claude_models:
  - claude-opus-4-8
  - claude-opus-4-6
  - claude-opus-4-5
  - claude-opus-4
  - claude-sonnet-4-5
  - claude-sonnet-4
  - claude-haiku-4-5

tools: []

api_key_apps: []
