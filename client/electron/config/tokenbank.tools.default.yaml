# tokenbank.tools.default.yaml
# 工具清单默认配置 — 程序内置，首次初始化时加载到 config-loader。
# 用户通过「导入配置」（本地文件或服务器下发）覆盖后，此文件不再使用。
# 格式与 tokenbank.routes.default.yaml 相同（统一 schema），各取所需的段。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口；占位符 {REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口；占位符 {MITM}=host:mitm_port

mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA

# ── 支持的 CLI 工具（接入方式 + 检测方式）──────────────────────────────────────
tools:
  - id: claude-code
    name: Claude Code
    route_bindable: true                    # 支持选择路由
    restrict_to_virtual: true               # 但仅限虚拟模型和包含虚拟模型的场景
    protocol: anthropic
    detect:
      command: claude
      version-arg: --version
      config-dirs: ['$CLAUDE_CONFIG_DIR', '~/.claude']
    strategy: base_url-env
    inject:
      env:
        ANTHROPIC_BASE_URL: http://{REVERSE}
        ANTHROPIC_AUTH_TOKEN: "{KEY}"

  - id: codex
    name: Codex (CLI)
    protocol: responses
    restrict_to_virtual: true               # 仅限虚拟模型和包含虚拟模型的场景
    detect:
      command: codex
      version-arg: --version
    strategy: config-file
    config-file: '{CODEX_HOME|~/.codex}/config.toml'
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.base_url: http://{REVERSE}/v1
      model_providers.tokenbank.wire_api: responses
    revert: state-precise

  - id: gemini-cli
    name: Gemini CLI
    protocol: gemini
    detect:
      command: gemini
      version-arg: --version
      config-dirs: ['~/.gemini']
    strategy: base_url-env
    inject:
      env:
        GEMINI_BASE_URL: http://{REVERSE}
        GEMINI_API_KEY: "{KEY}"

  # ── OpenCode（sst/opencode）：写 ~/.config/opencode/opencode.json 的 provider 段 ──
  - id: opencode
    name: OpenCode
    protocol: openai
    detect:
      command: opencode
      version-arg: --version
      config-dirs: ['~/.config/opencode']
    strategy: config-file
    config-file: '~/.config/opencode/opencode.json'
    patch:
      provider.tokenbank.npm: "@ai-sdk/openai-compatible"
      provider.tokenbank.name: Tokenbank
      provider.tokenbank.options.baseURL: http://{REVERSE}/v1
      provider.tokenbank.options.apiKey: "{KEY}"
    revert: state-precise

  # ── OpenClaw：写 ~/.openclaw/openclaw.json 的 models.providers 段 ──
  - id: openclaw
    name: OpenClaw
    protocol: openai
    detect:
      command: openclaw
      version-arg: --version
      config-dirs: ['~/.openclaw']
    strategy: config-file
    config-file: '~/.openclaw/openclaw.json'
    patch:
      models.providers.tokenbank.baseUrl: http://{REVERSE}/v1
      models.providers.tokenbank.apiKey: "{KEY}"
      models.providers.tokenbank.api: openai-completions
    revert: state-precise

  # ── Hermes Agent（NousResearch）：写 ~/.hermes/config.yaml 的 model 段 ──
  - id: hermes
    name: Hermes Agent
    protocol: openai
    detect:
      command: hermes
      version-arg: --version
      config-dirs: ['~/.hermes']
    strategy: config-file
    config-file: '~/.hermes/config.yaml'
    patch:
      model.provider: custom
      model.base_url: http://{REVERSE}/v1
      model.api_key: "{KEY}"
    revert: state-precise


# ── API Key 应用（检测到已安装则在列表显示「添加」，写其配置文件指向网关）──
# {BASE}=网关地址 {KEY}=应用 key（运行时按应用填入；真 key 不进此文件）
api_key_apps:
  - id: claude-desktop
    name: Claude Desktop
    icon: "🖥️"
    appx: Claude
    config_file: "{CLAUDE_3P_CONFIG}"
    marker: tokenbank
    enable_3p: true                         # 是否启用 Claude Desktop 3p 接入（false 则不显示该应用）
    route_bindable: true
    restrict_to_virtual: true               # 仅限虚拟模型
    # 全部写进 JSON 配置文件（Claude Desktop 从 JSON 读 key，不读环境变量）
    patch:
      inferenceProvider: gateway
      inferenceGatewayBaseUrl: "{BASE}"
      inferenceGatewayApiKey: "{KEY}"
      inferenceGatewayAuthScheme: bearer
      modelDiscoveryEnabled: false
      _configManagedBy: tokenbank

  - id: codex-desktop
    name: Codex Desktop
    icon: "🖥️"
    appx: OpenAI.Codex
    config_file: "{CODEX_HOME|~/.codex}/config.toml"
    marker: tokenbank
    route_bindable: true                    # Codex 支持模型改写
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.name: Tokenbank
      model_providers.tokenbank.base_url: "{BASE}/v1"
      model_providers.tokenbank.wire_api: responses
      model_providers.tokenbank.env_key: TOKENBANK_API_KEY
    env:
      TOKENBANK_API_KEY: "{KEY}"
