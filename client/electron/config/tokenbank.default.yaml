# tokenbank.yaml —— 客户端基础设施 + 会话解析（内置，不同步覆盖）
# 分工：
#   tokenbank.default.yaml     → gateway / mitm / claude_models / session_sources（本文件）
#   tokenbank.tools.default.yaml → 计费目录离线回退（与 server apps.default.yaml 同步）
#   tokenbank.routes.default.yaml → 场景路由离线回退（与 server scenes.default.yaml 同步）
# tools / api_key_apps 留空，由 GET /config/apps 写入 ~/.tokenbank/tokenbank.yaml。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口（base_url 指这里）；{REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口（HTTPS_PROXY 指这里）；{MITM}=host:mitm_port

# 证书来源（仅策略3 mitm-env 用）：用户配了用用户的，没配自动生成
mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA（约束=mitm-domains 并集）

# ════════ Claude 客户端模型名（内部透明逻辑，内置，不随同步留空）════════
# Claude Code/Desktop 强制用 Anthropic 模型名。这些名字仅用于：
#   1) /v1/models 暴露给 Claude，让它通过「必须 Anthropic 模型」校验、有名字可选；
#   2) 标记哪些请求模型属于 Claude 客户端。
# 真实使用的模型来自「用户在应用列表给该应用绑定的模型/路由」（经 keyScene 透明改写），
# 不在此处配置映射目标。
claude_models:
  - claude-opus-4-8
  - claude-opus-4-6
  - claude-opus-4-5
  - claude-opus-4
  - claude-sonnet-4-6
  - claude-sonnet-4-5
  - claude-sonnet-4
  - claude-haiku-4-5

# ════════ 会话用量解析（内置，YAML 驱动的解释器）════════
# 补录「不走本网关、直连官方」的用量：扫各工具的会话文件(JSONL/JSON)解析 token，
# 写库带 request_id → 与网关实时记录(proxy)按 request_id 去重，同一次调用只记一次。
# 字段值是 dot-path；写成数组=多候选，取第一个存在的。新增一个工具的统计只需加一段。
session_sources:
  - id: claude
    data_source: session-claude
    agent_id: claude-code
    provider_id: claude-cli
    tier: paid
    billing_type: subscription
    proxy_dedup: true                          # 会话 request_id=上游 msg_id，与网关 proxy 记录天然去重 →
                                               # 即便绑路由走网关也照常扫描（不会重复计）。codex/gemini 无此能力。
    root: "~/.claude/projects"
    glob: "**/*.jsonl"
    format: jsonl
    record_filter: { field: type, equals: assistant }
    require_fields: [message.usage]            # 必须存在才算一条用量
    request_id: [message.id, requestId]        # 跨源去重键（=上游 msg_xxx）
    require_request_id: true                   # 无 id 不记（避免重复扫描重复计）
    # 按 entrypoint 路由：cli/未知→session-claude（Claude Code CLI），claude-desktop*→Desktop 应用；
    # sdk-cli 是内部映射转发（网关已记为 proxy）→ 跳过，避免给 <synthetic> 等假模型记账/重复计。
    data_source_map:
      field: entrypoint
      map:
        claude-desktop: session-claude-desktop
        claude-desktop-3p: session-claude-desktop   # Desktop 启用第三方网关（Token Bank 等）
      prefix_map:
        claude-desktop: session-claude-desktop      # 兜底：claude-desktop-* 变体
      skip: [sdk-cli]
      default: session-claude
    fields:
      ts: timestamp
      model: message.model
      session_id: sessionId
      input_tokens: message.usage.input_tokens
      output_tokens: message.usage.output_tokens
      cache_create_tokens: message.usage.cache_creation_input_tokens
      cache_read_tokens: message.usage.cache_read_input_tokens
    # 注：entrypoint=claude-desktop 的用量(=Claude Desktop App 的 Cowork/Code tab 跑的 Claude Code)
    # 路由到 session-claude-desktop，由「Claude Desktop」api-key 应用并入展示（main.js SESSION_DS_BY_PRESET）。

  - id: codex
    data_source: session-codex
    agent_id: codex
    provider_id: codex-cli
    tier: paid
    billing_type: subscription
    root: "~/.codex/sessions"
    glob: "**/*.jsonl"
    format: jsonl
    session_id_from: filename                  # 默认会话 id = 文件名(去扩展名)，可被 meta 覆盖
    meta:                                       # 元信息行：更新运行中的 model / session_id
      - filter: { field: [type, payload.type], in: [session_meta, turn_context] }
        set:
          model: [model, info.model, payload.model, payload.info.model]
          session_id: [id, session_id, payload.id, payload.session_id]
    record_filter: { field: [payload.type, type], equals: token_count }
    accumulate:                                # token_count 事件携带累计用量 → 取增量
      input:  [payload.info.total_token_usage.input_tokens, payload.total_token_usage.input_tokens, payload.usage.input_tokens, payload.usage.prompt_tokens]
      output: [payload.info.total_token_usage.output_tokens, payload.total_token_usage.output_tokens, payload.usage.output_tokens, payload.usage.completion_tokens]
      cached: [payload.info.total_token_usage.cached_input_tokens, payload.total_token_usage.cached_input_tokens, payload.usage.cache_read_tokens]
    skip_if_zero: true
    request_id: "codex:{session_id}:{seq}"
    fields:
      ts: [timestamp, payload.timestamp]

  - id: gemini
    data_source: session-gemini
    agent_id: gemini-cli
    provider_id: gemini-cli
    tier: paid
    billing_type: subscription
    root: "~/.gemini/tmp"
    glob: "**/chats/session-*.json"
    format: json
    doc_session_id: [sessionId, session_id]    # 整文件级会话 id
    iterate: [messages, history]               # 遍历这个数组
    record_filter: { field: [role, type], in: [model, assistant], allow_missing: true }  # 只算模型产出侧；无 role 也算
    skip_if_zero: true
    request_id: "gemini:{session_id}:{index}"
    fields:
      input_tokens:  [tokens.promptTokenCount, usageMetadata.promptTokenCount, usage_metadata.promptTokenCount, usage.promptTokenCount, tokens.input, tokens.input_tokens]
      output_tokens: [tokens.candidatesTokenCount, usageMetadata.candidatesTokenCount, usage_metadata.candidatesTokenCount, usage.candidatesTokenCount, tokens.output, tokens.output_tokens]
      cache_read_tokens: [tokens.cachedContentTokenCount, usageMetadata.cachedContentTokenCount, tokens.cached]
      model: model
      ts: timestamp
    doc_fallback:                              # 取不到时回退整文件级字段
      model: [model]
      ts: [lastUpdated, updatedAt]

  - id: cursor                                 # Cursor：暂不能代理，仅扫会话日志统计（direct_only）
    data_source: session-cursor
    agent_id: cursor
    provider_id: cursor
    tier: paid
    billing_type: subscription
    direct_only: true                          # 标记：main.js 据此物化为「仅直连·只统计」应用（不绑路由/不走网关）
    app_name: Cursor
    app_icon: "🖱"
    root: "~/.cursor/projects"
    glob: "**/agent-transcripts/**/*.jsonl"    # <slug>/agent-transcripts/<sid>/<sid>.jsonl
    format: jsonl
    session_id_from: filename                  # 会话 id = 文件名(=<sid>)
    record_filter: { field: role, equals: assistant }
    # transcript 通常无 usage；纳管后由 Cursor stop hook 写入 token（见 electron/cursor-hooks.js）。
    # 未纳管时仍按 assistant 消息计请求数，token 为 0。
    request_id: "cursor:{session_id}:{index}"  # 同文件未变不重扫；跨扫描 INSERT OR IGNORE 去重
    record_label: assistant_tools               # 无 model 时不生成工具标签（见 session-import）
    fields:
      ts: [timestamp, message.timestamp]
      model: message.model
      input_tokens: message.usage.input_tokens
      output_tokens: message.usage.output_tokens
      cache_read_tokens: message.usage.cache_read_input_tokens
      cache_create_tokens: message.usage.cache_creation_input_tokens

  - id: opencode                               # OpenCode 用量存在 SQLite（非 JSONL）
    data_source: session-opencode
    agent_id: opencode
    provider_id: opencode-cli
    tier: paid
    billing_type: api-key
    format: sqlite
    db: "~/.local/share/opencode/opencode.db"  # WAL 模式：解释器会一并看 -wal mtime
    # 取每条 assistant 消息；message.data 是 JSON，session_id/message_id 来自行列
    query: "SELECT m.id AS message_id, m.session_id AS session_id, m.data AS data FROM message m"
    json_column: data
    record_filter: { field: role, equals: assistant }
    require_fields: [tokens, time.completed]   # 必须有 token 且消息已完成（未完成只有半截 token）
    skip_if_zero: true
    request_id: "opencode_session:{session_id}:{message_id}"
    # 整轮耗时 = time.completed - time.created（毫秒）
    latency_from:
      start: time.created
      end: time.completed
      first_token: true
    fields:
      ts: time.created                         # 毫秒时间戳（解释器按毫秒处理）
      model: modelID
      session_id: session_id
      input_tokens: tokens.input
      output_tokens: tokens.output
      output_extra: tokens.reasoning           # reasoning 并入输出（按输出计）
      cache_read_tokens: tokens.cache.read
      cache_create_tokens: tokens.cache.write

  - id: copilot-cli                              # GitHub Copilot CLI：扫 ~/.copilot/session-state
    data_source: session-copilot
    agent_id: copilot
    provider_id: github-copilot
    tier: paid
    billing_type: subscription
    direct_only: true                            # 不走网关，仅补录统计
    app_name: GitHub Copilot
    app_icon: "🤖"
    format: copilot-events                       # 自定义格式：一目录=一会话，events.jsonl
    root: "~/.copilot/session-state"
    glob: "*/events.jsonl"                       # <sessId>/events.jsonl

  - id: qwen                                     # Qwen Code：~/.qwen/projects/*/chats/*.jsonl
    data_source: session-qwen
    agent_id: qwen-code
    provider_id: qwen-cli
    tier: paid
    billing_type: subscription
    direct_only: true
    app_name: Qwen Code
    app_icon: "🐉"
    root: "~/.qwen/projects"
    glob: "*/chats/*.jsonl"
    format: jsonl
    session_id_from: filename
    record_filter: { field: type, equals: assistant }
    require_fields: [message.usage]
    skip_if_zero: true
    request_id: "qwen:{session_id}:{index}"
    fields:
      ts: timestamp
      model: message.model
      input_tokens: message.usage.input_tokens
      output_tokens: message.usage.output_tokens
      cache_create_tokens: message.usage.cache_creation_input_tokens
      cache_read_tokens: message.usage.cache_read_input_tokens

  - id: antigravity                              # Antigravity：~/.gemini/tmp/<hash>/chats/*.json
    data_source: session-antigravity
    agent_id: antigravity
    provider_id: antigravity
    tier: paid
    billing_type: subscription
    direct_only: true
    app_name: Antigravity
    app_icon: "🚀"
    root: "~/.gemini/tmp"
    glob: "**/chats/*.json"
    format: json
    doc_session_id: [sessionId, session_id]
    doc_skip: { field: kind, equals: main }      # kind=main 属于 Gemini CLI，留给 session-gemini
    iterate: messages
    record_filter: { field: type, equals: gemini }
    skip_if_zero: true
    request_id: "antigravity:{session_id}:{index}"
    fields:
      input_tokens: tokens.input
      output_tokens: tokens.output
      cache_read_tokens: tokens.cached
    doc_fallback:
      model: model
      ts: [lastUpdated, updatedAt]

  - id: grok                                     # Grok Build：~/.grok/sessions/<cwd>/<uuid>/
    data_source: session-grok
    agent_id: grok
    provider_id: grok
    tier: paid
    billing_type: api-key
    direct_only: true
    app_name: Grok
    app_icon: "𝕏"
    format: grok-session
    root: "~/.grok/sessions"
    skip_if_zero: true

# ════════ 客户端接入（内置留空，从服务器同步）════════
tools: []

# ── API Key 应用（内置留空，从服务器同步）──
api_key_apps: []
