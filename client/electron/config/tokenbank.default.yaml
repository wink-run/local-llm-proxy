# tokenbank.yaml —— 端到端唯一真相源（方案 Y）
# 一份配置同时管：客户端接入 + 上游 provider + 路由 + 证书来源。
# 内置默认；可从云端拉取覆盖（remote）。
# 铁律：真 key / 真证书永不进此文件，只放“去哪取”的引用（_ref）。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口（base_url 指这里）；{REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口（HTTPS_PROXY 指这里）；{MITM}=host:mitm_port

# 证书来源（仅策略3 mitm-env 用）：用户配了用用户的，没配自动生成
mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA（约束=mitm-domains 并集）

# ════════ 客户端接入 ════════
tools:
  - id: claude-code
    name: Claude Code
    protocol: anthropic
    detect:
      command: claude
      version-arg: --version
      config-dirs: ['$CLAUDE_CONFIG_DIR', '~/.claude']
    strategy: base_url-env
    inject:
      env:
        ANTHROPIC_BASE_URL: http://{REVERSE}

  - id: gemini-cli
    name: Gemini CLI
    protocol: gemini
    detect:
      command: gemini
      version-arg: --version
      config-dirs: ['~/.gemini']
    strategy: base_url-env
    inject:
      env:
        GEMINI_BASE_URL: http://{REVERSE}

  - id: codex
    name: Codex (CLI)
    protocol: responses
    detect:
      command: codex
      version-arg: --version
    strategy: config-file
    config-file: '{CODEX_HOME|~/.codex}/config.toml'
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.base_url: http://{REVERSE}/v1
      model_providers.tokenbank.wire_api: responses
    revert: state-precise

# protocol → 网关端点映射（不写死在代码里）
protocols:
  anthropic:
    reverse_path: /v1/messages
  responses:
    reverse_path: /v1/responses
  openai:
    reverse_path: /v1/chat/completions
  gemini:
    reverse_path: /v1beta
