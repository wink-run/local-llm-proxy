# tokenbank.yaml —— 客户端基础设施（内置，不同步覆盖）
# 应用清单由 GET /config/apps 写入 app_entities；补录规则由 handler 声明，随 handlers/session_scans 一并下发。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430
  mitm_port: 8888

mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}
    - auto

# Claude 协议透明改写用模型名白名单（非应用目录）
claude_models:
  - claude-opus-4-8
  - claude-opus-4-6
  - claude-opus-4-5
  - claude-opus-4
  - claude-sonnet-4-6
  - claude-sonnet-4-5
  - claude-sonnet-4
  - claude-haiku-4-5

tools: []
api_key_apps: []
