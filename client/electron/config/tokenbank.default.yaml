# tokenbank.yaml —— 端到端唯一真相源（方案 Y）
# 一份配置同时管：客户端接入 + 上游 provider + 路由 + 证书来源。
# 内置默认；可从云端拉取覆盖（remote）。
# 铁律：真 key / 真证书永不进此文件，只放“去哪取”的引用（_ref）。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口（base_url 指这里）；{REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口（HTTPS_PROXY 指这里）；{MITM}=host:mitm_port

# 证书来源（仅策略3 mitm-env 用）：用户配了用用户的，没配自动生成
mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA（约束=mitm-domains 并集）

# ════════ 客户端接入 ════════
tools:
  - id: claude-code
    name: Claude Code
    protocol: anthropic
    detect:
      command: claude
      version-arg: --version
      config-dirs: ['$CLAUDE_CONFIG_DIR', '~/.claude']
    strategy: base_url-env
    inject:
      env:
        ANTHROPIC_BASE_URL: http://{REVERSE}

  - id: gemini-cli
    name: Gemini CLI
    protocol: gemini
    detect:
      command: gemini
      version-arg: --version
      config-dirs: ['~/.gemini']
    strategy: base_url-env
    inject:
      env:
        GEMINI_BASE_URL: http://{REVERSE}

  - id: codex
    name: Codex (CLI)
    protocol: responses
    detect:
      command: codex
      version-arg: --version
    strategy: config-file
    config-file: '{CODEX_HOME|~/.codex}/config.toml'
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.base_url: http://{REVERSE}/v1
      model_providers.tokenbank.wire_api: responses
    revert: state-precise

  # ── 桌面 GUI 应用（Electron/Chromium）：走系统代理 + 系统信任库 ──
  # needs_ca=true：必须先把根 CA 装进系统信任库才能托管（MITM）
  - id: claude-desktop
    name: Claude Desktop
    protocol: anthropic
    type: gui
    needs_ca: true
    unsupported: true          # 实测：对 a-api.anthropic.com 做了证书锁定，无法 MITM
    detect:
      appx: Claude
    strategy: mitm-system
    mitm-domains: [api.anthropic.com, a-api.anthropic.com, claude.ai]
    note: 证书锁定，无法托管（应用拒绝自定义根证书）

  - id: codex-desktop
    name: Codex Desktop
    protocol: responses
    type: gui
    needs_ca: true
    detect:
      appx: OpenAI.Codex
    strategy: mitm-system
    mitm-domains: [chatgpt.com, ab.chatgpt.com, ws.chatgpt.com, chat.openai.com, api.openai.com]
    note: 实测证书可拦截（不锁定）；MITM 转发完善中
