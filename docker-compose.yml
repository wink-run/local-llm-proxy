services:

  # ── Backend API server ───────────────────────────────────────────────────────
  proxy:
    build:
      context: ./server
    # 生产环境经 nginx 暴露 HTTPS 时可注释下一行，仅保留 expose
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file: .env
    environment:
      - DB_PATH=/app/data/proxy.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Nginx HTTPS 反代（绑定域名）────────────────────────────────────────────
  # 用法见 .env.example：放置证书后 docker compose --profile https up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-tokenbank.example.com}
      UPSTREAM: ${NGINX_UPSTREAM:-proxy:8000}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-gateway.example.com}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway:11431}
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/docker-entrypoint.d/20-generate-certs.sh:/docker-entrypoint.d/20-generate-certs.sh:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - proxy
    restart: unless-stopped

  # 可选：同时为 CLI Gateway 配置 HTTPS（需 gateway-fullchain.pem 等）
  nginx-gateway:
    image: nginx:1.27-alpine
    profiles: [gateway-https]
    ports:
      - "8443:443"
      - "8080:80"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-gateway.example.com}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway:11431}
    volumes:
      - ./nginx/templates/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/docker-entrypoint.d/20-generate-certs.sh:/docker-entrypoint.d/20-generate-certs.sh:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - gateway
    restart: unless-stopped

  # ── CLI Gateway (headless, no Electron) ──────────────────────────────────────
  gateway:
    build:
      context: ./client
      dockerfile: Dockerfile.cli
    ports:
      - "11430:11430"   # OpenAI-compatible gateway (OPENAI_BASE_URL)
      - "11431:11431"   # Admin API + Web UI
    volumes:
      - ./gateway-data:/data/.llm-agent   # config.json + local-config.json live here
    environment:
      - HOME=/data
      - NODE_ENV=production
      - GATEWAY_BIND_HOST=0.0.0.0
      - TOKEN_SERVER_URL=https://tokenbank.wink.run/
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://localhost:11431/api/gateway/status', r => {
            process.exit(r.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  certbot_www:
