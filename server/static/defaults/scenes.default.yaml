# tokenbank.routes.default.yaml（服务端 canonical）
# 场景路由默认配置 — 首次启动写入 config.scenes，客户端同步到 local-config.scene_routes。
# steps[].model 须能在 payg_providers / claude_models 中解析到刊例价。

version: 1

scene_routes:
  # ── 策略路由（模型无关，无 steps）：网关按请求类型扫该类型下所有(源,模型)候选、按 strategy 排序 + failover。
  #    strategy 逻辑由客户端 routing-strategies.js 里同名 JS 实现。客户端像选场景路由一样选。
  - id: strategy-cost
    scene_name: 实惠优先
    icon: 💰
    model_key: llm-router-cost
    strategy: cost
  - id: strategy-speed
    scene_name: 速度优先
    icon: ⚡
    model_key: llm-router-speed
    strategy: speed
  - id: strategy-fallback
    scene_name: 按顺序
    icon: 📇
    model_key: llm-router-fallback
    strategy: fallback
  - id: strategy-round-robin
    scene_name: 轮询
    icon: 🔄
    model_key: llm-router-round-robin
    strategy: round-robin
  - id: strategy-weighted
    scene_name: 加权
    icon: ⚖️
    model_key: llm-router-weighted
    strategy: weighted

  - id: route-code
    scene_name: 代码助手
    icon: 💻
    model_key: llm-router-code
    steps:
      - model: claude-sonnet-4-6
        tier: paid
      - model: gpt-4o
        tier: paid
      - model: deepseek-chat
        tier: paid

  - id: route-chat
    scene_name: 日常对话
    icon: 💬
    model_key: llm-router-chat
    steps:
      - model: deepseek-chat
        tier: paid
      - model: gpt-4o-mini
        tier: paid

  - id: route-long
    scene_name: 长上下文
    icon: 📄
    model_key: llm-router-long
    steps:
      - model: claude-sonnet-4-6
        tier: paid
      - model: gemini-2.5-pro
        tier: paid

  - id: route-fast
    scene_name: 快速响应
    icon: ⚡
    model_key: llm-router-fast
    steps:
      - model: claude-haiku-4-5
        tier: paid
      - model: gpt-4o-mini
        tier: paid
      - model: llama-3.3-70b
        tier: paid
