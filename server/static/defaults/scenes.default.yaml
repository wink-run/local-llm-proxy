# tokenbank.routes.default.yaml（服务端 canonical）
# 场景路由默认配置 — 首次启动写入 config.scenes，客户端同步到 local-config.scene_routes。
# steps[].model 须能在 payg_providers / claude_models 中解析到刊例价。

version: 1

scene_routes:
  - id: route-code
    scene_name: 代码助手
    icon: 💻
    model_key: llm-router-code
    steps:
      - model: claude-sonnet-4-6
        tier: paid
      - model: gpt-4o
        tier: paid
      - model: deepseek-chat
        tier: paid

  - id: route-chat
    scene_name: 日常对话
    icon: 💬
    model_key: llm-router-chat
    steps:
      - model: deepseek-chat
        tier: paid
      - model: gpt-4o-mini
        tier: paid

  - id: route-long
    scene_name: 长上下文
    icon: 📄
    model_key: llm-router-long
    steps:
      - model: claude-sonnet-4-6
        tier: paid
      - model: gemini-2.5-pro
        tier: paid

  - id: route-fast
    scene_name: 快速响应
    icon: ⚡
    model_key: llm-router-fast
    steps:
      - model: claude-haiku-4-5
        tier: paid
      - model: gpt-4o-mini
        tier: paid
      - model: llama-3.3-70b
        tier: paid
