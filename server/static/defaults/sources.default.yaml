# sources.default.yaml（服务端 canonical · 个人页「源」目录）
# 订阅账户 / 按量付费 / 套餐模板 —— 由管理后台 Billing Sources 表单维护，publish 编译进 config.sources，
# 与应用清单 apps.default.yaml（tools / api_key_apps）彻底分离。
# 客户端经 GET /api/config/sources 同步，写入 ~/.tokenbank/tokenbank.tools.yaml；
# 与 client/electron/config/tokenbank.tools.default.yaml 同 schema。
# subscription_to_api: 订阅是否可转为 API 供给源（供给源页可选）；默认 false。
# 铁律：真 key / 真证书永不进此文件。

version: 1

# ── App 订阅源（订阅维度：source_id/plan_provider_id/subscription_to_api；agent_id 为对应用目录的外键引用）──
subscription_apps:
  - source_id: claude
    agent_id: claude-code
    app_name: Claude Code
    app_icon: "🔷"
    plan_provider_id: anthropic-paid
    subscription_to_api: true

  - source_id: codex
    agent_id: codex
    app_name: Codex
    app_icon: "⚡"
    plan_provider_id: openai
    subscription_to_api: false

  - source_id: gemini
    agent_id: gemini-cli
    app_name: Gemini CLI
    app_icon: "♊"
    plan_provider_id: gemini
    subscription_to_api: false

  - source_id: cursor
    agent_id: cursor
    app_name: Cursor
    app_icon: "🖱️"
    plan_provider_id: cursor
    subscription_to_api: false
    # Cursor 代理多家模型；订阅转 API 估价用代表性主流模型（USD / 1M tokens）
    models: [claude-opus-4-8, claude-sonnet-4-6, gpt-5.4, gpt-5.3-codex, gemini-2.5-pro, gemini-2.5-flash]
    pricing:
      claude-opus-4-8:   { in: 5.00, out: 25.00 }
      claude-sonnet-4-6: { in: 3.00, out: 15.00 }
      gpt-5.4:           { in: 2.50, out: 15.00 }
      gpt-5.3-codex:     { in: 2.50, out: 15.00 }
      gemini-2.5-pro:    { in: 1.25, out: 10.00 }
      gemini-2.5-flash:  { in: 0.30, out: 2.50 }

  - source_id: copilot-cli
    agent_id: copilot
    app_name: GitHub Copilot
    app_icon: "🤖"
    plan_provider_id: github-copilot
    subscription_to_api: false
    models: [gpt-5.4, gpt-5-mini, claude-opus-4-8, claude-sonnet-4-6, gemini-2.5-pro]
    pricing:
      gpt-5.4:           { in: 2.50, out: 15.00 }
      gpt-5-mini:        { in: 0.15, out: 0.60 }
      claude-opus-4-8:   { in: 5.00, out: 25.00 }
      claude-sonnet-4-6: { in: 3.00, out: 15.00 }
      gemini-2.5-pro:    { in: 1.25, out: 10.00 }

  - source_id: antigravity
    agent_id: antigravity
    app_name: Antigravity
    app_icon: "🚀"
    plan_provider_id: gemini
    subscription_to_api: false

# 预置 API 订阅（仅 API 厂商订阅产品，不含 APP 订阅）
api_subscription_apps:
  - source_id: api-volcengine
    app_name: 火山引擎
    app_icon: "🌋"
    plan_provider_id: volcengine
    # 豆包 Coding Plan 多模型网关（豆包 + deepseek/glm/kimi）；价格为代表性估算（USD / 1M tokens）
    models: [doubao-seed-2.0-pro, doubao-seed-2.0-code, doubao-seed-2.0-flash, deepseek-v3.2, kimi-k2.6]
    pricing:
      doubao-seed-2.0-pro:   { in: 0.40, out: 1.20 }
      doubao-seed-2.0-code:  { in: 0.40, out: 1.20 }
      doubao-seed-2.0-flash: { in: 0.10, out: 0.30 }
      deepseek-v3.2:         { in: 0.14, out: 0.28 }
      kimi-k2.6:             { in: 0.15, out: 2.50 }

subscription_plans:
  anthropic-paid:
    - { id: claude-pro, label: Claude Pro, monthly_usd: 20 }
    - { id: max5x, label: Claude Max (5×), monthly_usd: 100 }
    - { id: max20x, label: Claude Max (20×), monthly_usd: 200 }
  openai:
    - { id: chatgpt-plus, label: ChatGPT Plus, monthly_usd: 20 }
    - { id: chatgpt-team, label: ChatGPT Team, monthly_usd: 25 }
    - { id: chatgpt-pro, label: ChatGPT Pro, monthly_usd: 200 }
  gemini:
    - { id: gemini-advanced, label: Gemini Advanced, monthly_usd: 20 }
    - { id: google-one-ai, label: Google One AI, monthly_usd: 20 }
  github-copilot:
    - { id: copilot-pro, label: GitHub Copilot Pro, monthly_usd: 10 }
    - { id: copilot-business, label: Copilot Business, monthly_usd: 19 }
  cursor:
    - { id: cursor-pro, label: Cursor Pro, monthly_usd: 20 }
    - { id: cursor-ultra, label: Cursor Ultra, monthly_usd: 200 }
  volcengine:
    - { id: coding-lite, label: Coding Plan Lite · 40元/月, monthly_usd: 5.71 }
    - { id: coding-pro, label: Coding Plan Pro · 200元/月, monthly_usd: 28.57 }

payg_providers:
  - id: openai
    label: OpenAI
    icon: "🤖"
    aliases: [codex-cli]
    models: [gpt-4o, gpt-4o-mini, gpt-4.1, gpt-5, gpt-5-mini]
    pricing:
      gpt-4o:      { in: 2.50, out: 10.00, cacheRead: 1.25, cacheWrite: 3.13 }
      gpt-4o-mini: { in: 0.15, out: 0.60,  cacheRead: 0.075, cacheWrite: 0.19 }
      gpt-4.1:     { in: 2.50, out: 10.00, cacheRead: 1.25, cacheWrite: 3.13 }
      gpt-5:       { in: 1.25, out: 10.00, cacheRead: 0.125, cacheWrite: 1.56 }
      gpt-5-mini:  { in: 0.15, out: 0.60,  cacheRead: 0.015, cacheWrite: 0.19 }
  - id: anthropic-paid
    label: Anthropic
    icon: "🧬"
    aliases: [claude-cli]
    models: [claude-sonnet-4-6, claude-sonnet-4-5, claude-sonnet-4, claude-haiku-4-5, claude-opus-4-6]
    pricing:
      claude-opus-4-6:   { in: 5.00, out: 25.00, cacheRead: 0.50, cacheWrite: 6.25 }
      claude-sonnet-4-6: { in: 3.00, out: 15.00, cacheRead: 0.30, cacheWrite: 3.75 }
      claude-sonnet-4-5: { in: 3.00, out: 15.00, cacheRead: 0.30, cacheWrite: 3.75 }
      claude-sonnet-4:   { in: 3.00, out: 15.00, cacheRead: 0.30, cacheWrite: 3.75 }
      claude-haiku-4-5:  { in: 1.00, out: 5.00,  cacheRead: 0.10, cacheWrite: 1.25 }
  - id: gemini
    label: Google Gemini
    icon: "💎"
    aliases: [gemini-cli]
    models: [gemini-2.5-pro, gemini-2.5-flash, gemini-2.0-flash]
    pricing:
      gemini-2.5-pro:   { in: 1.25, out: 10.00, cacheRead: 0.125, cacheWrite: 1.56 }
      gemini-2.5-flash: { in: 0.30, out: 2.50,  cacheRead: 0.03,  cacheWrite: 0.38 }
      gemini-2.0-flash: { in: 0.075, out: 0.30, cacheRead: 0.0075, cacheWrite: 0.094 }
  - id: deepseek
    label: DeepSeek
    icon: "🐋"
    models: [deepseek-chat, deepseek-reasoner]
    pricing:
      deepseek-chat:     { in: 0.14, out: 0.28, cacheRead: 0.003, cacheWrite: 0.18 }
      deepseek-reasoner: { in: 0.14, out: 0.28, cacheRead: 0.003, cacheWrite: 0.18 }
  - id: xai
    label: xAI Grok
    icon: "✖️"
    aliases: [grok]
    models: [grok-4, grok-3-mini]
    pricing:
      grok-4:      { in: 3.00, out: 15.00 }
      grok-3-mini: { in: 0.30, out: 0.50 }
  - id: openrouter
    label: OpenRouter
    icon: "🛣"
    models: [gpt-4o, claude-sonnet-4-5]
    pricing:
      gpt-4o:            { in: 3.00, out: 12.00, cacheRead: 1.50 }
      claude-sonnet-4-5: { in: 3.50, out: 16.00, cacheRead: 0.35 }
  - id: agnes-ai
    label: Agnes AI
    icon: "🤍"
    # Agnes AI 为免费额度 + 订阅配额制（按 RPM/日请求量限额），不按 token 计费；价格占位为 0。
    models: [agnes-2.0-flash]
    pricing:
      agnes-2.0-flash: { in: 0, out: 0 }
  - id: fireworks
    label: Fireworks
    icon: "🎆"
    # Fireworks serverless 按模型规模档统一计价（in=out 同价；缓存输入约为标准输入 50%）。USD / 1M tokens。
    models: [llama-v3p1-8b-instruct, llama-v3p3-70b-instruct, llama-v3p1-405b-instruct, deepseek-v3, qwen2p5-72b-instruct]
    pricing:
      llama-v3p1-8b-instruct:   { in: 0.20, out: 0.20, cacheRead: 0.10 }
      llama-v3p3-70b-instruct:  { in: 0.90, out: 0.90, cacheRead: 0.45 }
      llama-v3p1-405b-instruct: { in: 3.00, out: 3.00, cacheRead: 1.50 }
      deepseek-v3:              { in: 0.90, out: 0.90, cacheRead: 0.45 }
      qwen2p5-72b-instruct:     { in: 0.90, out: 0.90, cacheRead: 0.45 }
