version: 2
# 社区推荐资源默认种子（服务器下发，可被 DB config.community_catalog 覆盖）。
# 面向普通用户：写作 / 语言 / 学习 / 职场 / 生活 / 理财 / 决策 / 创意为主，附少量开发类。
# 参考社区经典合集（prompts.chat / awesome-chatgpt-prompts，CC0），文案为改写精简版。
prompts:
# ── 开发 ──────────────────────────────────────────────
- catalog_id: code-review-prompt
  type: prompt
  name: code-review
  display_name: 代码审查
  description: 结构化代码审查：安全、性能、可维护性
  metadata:
    tags: [code, review, quality]
    version: 1.0.0
  content: |
    你是一个资深代码审查专家。请审查以下代码，输出：
    1. 严重问题（必须修复）
    2. 改进建议（可选）
    3. 简要总结

    {{#if focus_security}}重点关注安全漏洞与权限问题。{{/if}}
    {{#if focus_performance}}重点关注性能与资源占用。{{/if}}

    代码：
    ```
    {{code}}
    ```
- catalog_id: api-design-prompt
  type: prompt
  name: api-design
  display_name: API 设计
  description: REST/OpenAPI 接口设计与评审
  metadata:
    tags: [api, design, backend]
    version: 1.0.0
  content: |
    你是 API 架构师。根据需求设计 REST API：
    - 资源命名与 HTTP 动词
    - 请求/响应 JSON Schema 要点
    - 错误码与分页约定
    - 鉴权方式建议

    需求描述：
    {{requirements}}
# ── 写作与表达 ────────────────────────────────────────
- catalog_id: text-polish-prompt
  type: prompt
  name: text-polish
  display_name: 文本润色
  description: 让文字更通顺、专业、易读，不改原意
  metadata:
    tags: [writing, editing, general]
    version: 1.0.0
  content: |
    你是中文写作编辑。请润色下面这段文字：更通顺、专业、易读，保持原意与语气，
    不添加新信息。先给润色后的完整版本，再用 2-3 条要点说明主要改动。

    原文：
    {{text}}
- catalog_id: tone-rewrite-prompt
  type: prompt
  name: tone-rewrite
  display_name: 语气改写
  description: 把一段话改成正式/亲切/简洁等指定语气
  metadata:
    tags: [writing, tone, general]
    version: 1.0.0
  content: |
    请把下面这段话改写成「{{tone}}」的语气（如正式、亲切、简洁、热情、委婉），
    保持核心信息不变，长度相近。只输出改写结果。

    原文：
    {{text}}
- catalog_id: summarize-prompt
  type: prompt
  name: summarize
  display_name: 内容总结
  description: 把长文压成要点摘要
  metadata:
    tags: [writing, summary, productivity]
    version: 1.0.0
  content: |
    请阅读下面的内容并输出：
    1. 一句话概括
    2. 3-5 条关键要点
    3. 若有，列出结论或待办

    内容：
    {{content}}
- catalog_id: proofread-prompt
  type: prompt
  name: proofread
  display_name: 语法校对
  description: 找出并修正错别字、语法与标点问题
  metadata:
    tags: [writing, grammar, general]
    version: 1.0.0
  content: |
    请校对下面文字的错别字、语法、标点与用词问题。输出：
    - 修正后的完整文本
    - 一个「原→改」的修改清单

    文本：
    {{text}}
- catalog_id: expand-outline-prompt
  type: prompt
  name: expand-outline
  display_name: 提纲扩写
  description: 把要点/提纲扩写成完整段落
  metadata:
    tags: [writing, general]
    version: 1.0.0
  content: |
    请把下面的要点/提纲扩写成结构清晰、逻辑连贯的完整文章，语气「{{tone}}」，
    面向「{{audience}}」读者。不要编造具体数字或事实。

    提纲：
    {{outline}}
- catalog_id: simplify-text-prompt
  type: prompt
  name: simplify-text
  display_name: 化繁为简
  description: 把专业/复杂内容改写成人人能懂
  metadata:
    tags: [writing, explain, general]
    version: 1.0.0
  content: |
    请把下面这段内容改写成普通人一读就懂的大白话，避免术语；
    必须保留的专业词请用括号简单解释。

    原文：
    {{text}}
# ── 邮件与沟通 ────────────────────────────────────────
- catalog_id: email-compose-prompt
  type: prompt
  name: email-compose
  display_name: 邮件撰写
  description: 根据要点起草得体的邮件
  metadata:
    tags: [email, communication, work]
    version: 1.0.0
  content: |
    请根据以下信息起草一封邮件：
    - 收件人：{{recipient}}
    - 目的：{{purpose}}
    - 要点：{{points}}
    - 语气：{{tone}}（默认：专业友好）

    给出主题行 + 正文，简洁得体，可直接发送。
- catalog_id: reply-draft-prompt
  type: prompt
  name: reply-draft
  display_name: 回复起草
  description: 针对收到的消息拟一份回复
  metadata:
    tags: [email, communication, work]
    version: 1.0.0
  content: |
    我收到下面这条消息，想以「{{stance}}」的立场回复（如答应/婉拒/追问/致歉）。
    请帮我拟一份得体、清晰的回复，并说明为什么这样措辞。

    对方消息：
    {{message}}
- catalog_id: meeting-minutes-prompt
  type: prompt
  name: meeting-minutes
  display_name: 会议纪要
  description: 把零散记录整理成结构化纪要
  metadata:
    tags: [work, meeting, productivity]
    version: 1.0.0
  content: |
    请把下面的会议记录整理成纪要，包含：
    1. 一句话主题
    2. 关键讨论与决定
    3. 待办事项（负责人 + 期限，若有）
    4. 待确认/遗留问题

    记录：
    {{notes}}
# ── 语言与翻译 ────────────────────────────────────────
- catalog_id: translate-prompt
  type: prompt
  name: translate
  display_name: 地道翻译
  description: 自然流畅的翻译，非逐字直译
  metadata:
    tags: [translation, language, general]
    version: 1.0.0
  content: |
    请把下面文字翻译成「{{target_lang}}」，追求地道自然、符合母语者表达习惯，
    而非逐字直译。保留原文格式。若有歧义或文化点，翻译后简短注明。

    原文：
    {{text}}
- catalog_id: explain-word-prompt
  type: prompt
  name: explain-word
  display_name: 词义讲解
  description: 讲清一个词的含义、用法与例句
  metadata:
    tags: [language, learning, general]
    version: 1.0.0
  content: |
    请讲解「{{word}}」：
    - 含义（分常见义项）
    - 典型用法/搭配
    - 2-3 个例句（附翻译）
    - 近义词及细微差别
- catalog_id: english-oral-prompt
  type: prompt
  name: english-oral
  display_name: 英语口语陪练
  description: 模拟对话并纠正表达
  metadata:
    tags: [language, english, learning]
    version: 1.0.0
  content: |
    你是我的英语口语陪练。请就「{{topic}}」用英语和我对话，每次只说 2-3 句并抛出一个问题。
    当我的英语有错误或不地道时，在回复末尾用【纠错】给出更自然的说法（中文解释）。
    从现在开始，先用英语向我打招呼。
# ── 学习与知识 ────────────────────────────────────────
- catalog_id: eli5-prompt
  type: prompt
  name: eli5
  display_name: 通俗解释
  description: 像给外行讲一样把概念讲明白
  metadata:
    tags: [learning, explain, general]
    version: 1.0.0
  content: |
    请把「{{concept}}」解释给一个完全的外行听：
    - 用一个生活中的类比开头
    - 再讲它到底是什么、为什么重要
    - 避免术语，必要时括号解释
- catalog_id: study-plan-prompt
  type: prompt
  name: study-plan
  display_name: 学习计划
  description: 为一个目标定制阶段性学习路线
  metadata:
    tags: [learning, planning, general]
    version: 1.0.0
  content: |
    我想学「{{goal}}」，目前水平「{{level}}」，每周可投入「{{hours}}」小时，目标期限「{{deadline}}」。
    请制定阶段性学习计划：里程碑、每周任务、推荐资源类型、如何自测进度。
- catalog_id: quiz-generator-prompt
  type: prompt
  name: quiz-generator
  display_name: 出题自测
  description: 就一段材料生成测验题
  metadata:
    tags: [learning, quiz, general]
    version: 1.0.0
  content: |
    根据下面材料出 {{count}} 道题（混合选择题与简答题），由易到难。
    先只给题目；我作答后你再逐题批改并解释。

    材料：
    {{material}}
- catalog_id: concept-map-prompt
  type: prompt
  name: concept-map
  display_name: 知识梳理
  description: 把一个主题拆成结构化知识框架
  metadata:
    tags: [learning, structure, general]
    version: 1.0.0
  content: |
    请把「{{topic}}」梳理成一张知识框架：
    - 核心概念与它们的关系（用层级列表表示）
    - 每个概念一句话说明
    - 初学者最容易混淆/忽略的点
# ── 职场与求职 ────────────────────────────────────────
- catalog_id: resume-polish-prompt
  type: prompt
  name: resume-polish
  display_name: 简历优化
  description: 用成果导向改写简历条目
  metadata:
    tags: [career, resume, work]
    version: 1.0.0
  content: |
    请把下面的简历经历改写得更有说服力：突出成果与量化数据（动词开头、STAR 结构），
    删去空话套话。针对「{{target_role}}」岗位。保留真实，不编造数字。

    原始经历：
    {{experience}}
- catalog_id: interview-prep-prompt
  type: prompt
  name: interview-prep
  display_name: 面试准备
  description: 预测问题并陪练模拟面试
  metadata:
    tags: [career, interview, work]
    version: 1.0.0
  content: |
    你是「{{role}}」岗位的面试官。请先列出 5 个最可能被问到的问题，
    然后逐个向我提问、等我回答后给出点评与更优答法。现在提出第一个问题。
- catalog_id: cover-letter-prompt
  type: prompt
  name: cover-letter
  display_name: 求职信
  description: 根据岗位与背景写求职信
  metadata:
    tags: [career, writing, work]
    version: 1.0.0
  content: |
    请为我写一封求职信：
    - 目标岗位：{{role}} @ {{company}}
    - 我的亮点：{{highlights}}
    简洁真诚（250 字内），说明为何匹配、为何想加入，避免空泛。
- catalog_id: weekly-report-prompt
  type: prompt
  name: weekly-report
  display_name: 周报生成
  description: 把零散工作项整理成清晰周报
  metadata:
    tags: [work, report, productivity]
    version: 1.0.0
  content: |
    请把下面这周做的事整理成周报：本周完成、进行中、下周计划、需要的支持/风险。
    条理清晰、突出成果，供汇报使用。

    这周做的事：
    {{items}}
# ── 生活 ──────────────────────────────────────────────
- catalog_id: travel-plan-prompt
  type: prompt
  name: travel-plan
  display_name: 旅行规划
  description: 定制每日行程与实用建议
  metadata:
    tags: [life, travel, planning]
    version: 1.0.0
  content: |
    请为一次旅行做行程：
    - 目的地：{{destination}}
    - 天数：{{days}}，人数/同行：{{party}}
    - 偏好：{{interests}}，预算：{{budget}}
    按天给出安排（含大致时间、交通与就餐建议），标注需提前预订项，末尾附实用贴士。
- catalog_id: recipe-suggest-prompt
  type: prompt
  name: recipe-suggest
  display_name: 食谱推荐
  description: 用现有食材给出可做的菜
  metadata:
    tags: [life, cooking, general]
    version: 1.0.0
  content: |
    我冰箱里有：{{ingredients}}。口味偏好：{{preference}}，可接受烹饪时间：{{time}}。
    请推荐 2-3 道能做的菜，每道给食材清单（标出还需额外购买的）与简明步骤。
- catalog_id: workout-plan-prompt
  type: prompt
  name: workout-plan
  display_name: 健身方案
  description: 按目标和条件定制训练计划
  metadata:
    tags: [life, fitness, health]
    version: 1.0.0
  content: |
    请为我制定一周健身计划：
    - 目标：{{goal}}（如减脂/增肌/体能）
    - 现状与限制：{{condition}}
    - 每周可训练：{{days_per_week}} 天，器材：{{equipment}}
    给出每天安排与动作组数，附热身/拉伸与循序渐进建议。提醒：如有伤病请先咨询专业人士。
- catalog_id: gift-idea-prompt
  type: prompt
  name: gift-idea
  display_name: 礼物灵感
  description: 按对象与预算给出送礼建议
  metadata:
    tags: [life, general]
    version: 1.0.0
  content: |
    请为我推荐礼物：
    - 送给：{{who}}（关系/年龄/喜好：{{about}}）
    - 场合：{{occasion}}，预算：{{budget}}
    给 5-8 个不同价位与风格的点子，每个一句话说明为何合适，避免俗套。
# ── 理财与决策 ────────────────────────────────────────
- catalog_id: budget-advice-prompt
  type: prompt
  name: budget-advice
  display_name: 预算建议
  description: 分析收支给出可执行的预算方案
  metadata:
    tags: [finance, planning, life]
    version: 1.0.0
  content: |
    我的月收入约 {{income}}，主要支出：{{expenses}}，理财目标：{{goal}}。
    请给出一个可执行的预算分配建议（如 50/30/20 之类）、可优化的开支、以及第一步该做什么。
    说明：这是通用信息参考，非专业投资建议。
- catalog_id: terms-explain-prompt
  type: prompt
  name: terms-explain
  display_name: 条款解读
  description: 把合同/协议条款讲成人话并提示风险
  metadata:
    tags: [life, legal, general]
    version: 1.0.0
  content: |
    请用大白话解读下面这段条款：它到底是什么意思、对我有什么影响、有哪些需要注意的坑或风险点。
    说明：这是通俗解读，重大事项请咨询专业人士。

    条款原文：
    {{clause}}
- catalog_id: pros-cons-prompt
  type: prompt
  name: pros-cons
  display_name: 利弊权衡
  description: 系统列出一个选择的优缺点
  metadata:
    tags: [decision, thinking, general]
    version: 1.0.0
  content: |
    我在考虑：{{decision}}。请客观列出利与弊（各 4-6 条，按重要性排序），
    指出最关键的 1-2 个权衡点，并说明哪种人更适合选它——但不替我下结论。
- catalog_id: decision-matrix-prompt
  type: prompt
  name: decision-matrix
  display_name: 决策矩阵
  description: 多选项按加权标准打分对比
  metadata:
    tags: [decision, thinking, productivity]
    version: 1.0.0
  content: |
    帮我做加权决策矩阵。
    - 选项：{{options}}
    - 我看重的标准（可带权重）：{{criteria}}
    请用表格给每个选项按各标准打分（1-5）、算加权总分，并给出解读与提醒盲点。
# ── 创意与效率 ────────────────────────────────────────
- catalog_id: brainstorm-prompt
  type: prompt
  name: brainstorm
  display_name: 头脑风暴
  description: 围绕一个主题快速产出大量点子
  metadata:
    tags: [creative, ideation, productivity]
    version: 1.0.0
  content: |
    请就「{{topic}}」做头脑风暴，产出 15+ 个点子，覆盖不同角度（常规的、省钱的、大胆的、反直觉的）。
    先只列点子；之后我挑出感兴趣的，你再帮我展开。
- catalog_id: daily-planner-prompt
  type: prompt
  name: daily-planner
  display_name: 每日计划
  description: 把待办排成合理的一天日程
  metadata:
    tags: [productivity, planning, general]
    version: 1.0.0
  content: |
    这是我今天要做的事：{{tasks}}。可用时间段：{{hours}}。
    请帮我排出一天日程：按优先级和精力曲线安排，穿插休息，标出最重要的 1-3 件（must-do），
    并预留缓冲时间。
skills:
# ── 开发 ──────────────────────────────────────────────
- catalog_id: git-commit-skill
  type: skill
  name: git-commit
  display_name: Git 提交规范
  description: 生成符合 Conventional Commits 的提交信息
  metadata:
    tags: [git, commit, workflow]
    version: 1.0.0
    compatible_agents: [claude-code, codex, cursor, workbuddy]
  content: |
    ---
    name: git-commit
    description: 分析 diff 并生成规范的 Git 提交信息（Conventional Commits）
    ---

    # Git Commit Skill

    ## 何时使用
    用户要求写 commit message、总结变更、或准备 git commit 时。

    ## 规则
    1. 使用 Conventional Commits：feat/fix/docs/refactor/test/chore 等
    2. 标题 ≤ 72 字符，英文或中文均可
    3. 正文说明 WHY，必要时列出 BREAKING CHANGE

    ## 输出格式
    ```
    <type>(<scope>): <subject>

    <body>
    ```
- catalog_id: systematic-debugging-skill
  type: skill
  name: systematic-debugging
  display_name: 系统化调试
  description: 遇 bug 时按步骤收集证据再修复
  metadata:
    tags: [debug, quality]
    version: 1.0.0
    compatible_agents: [claude-code, codex, cursor, workbuddy]
  content: |
    ---
    name: systematic-debugging
    description: 系统化调试流程，先复现与定位根因再改代码
    ---

    # Systematic Debugging

    ## 流程
    1. 复现：最小步骤、期望 vs 实际
    2. 证据：日志、堆栈、最近变更
    3. 假设：列出 2–3 个可能根因并验证
    4. 修复：最小 diff，附带验证方式
    5. 回归：确认未引入新问题

    ## 禁止
    - 未理解根因就大面积重写
    - 同时改多处 unrelated 代码
- catalog_id: explain-code-skill
  type: skill
  name: explain-code
  display_name: 代码讲解
  description: 逐段讲清一段代码在做什么
  metadata:
    tags: [code, learning, dev]
    version: 1.0.0
    compatible_agents: [claude-code, codex, cursor, workbuddy]
  content: |
    ---
    name: explain-code
    description: 为初学者逐段讲解代码的意图、流程与关键点
    ---

    # Explain Code

    ## 何时使用
    用户贴出一段代码问「这是干嘛的」「看不懂」时。

    ## 讲解方式
    1. 一句话说明整段代码的目的
    2. 分块讲每部分做什么（不逐行念，抓关键）
    3. 指出用到的重要概念/语法点
    4. 提示潜在坑或可改进处

    ## 风格
    面向初学者，少术语，多类比。
- catalog_id: sql-helper-skill
  type: skill
  name: sql-helper
  display_name: SQL 助手
  description: 用自然语言写、解释、优化 SQL
  metadata:
    tags: [sql, data, dev]
    version: 1.0.0
    compatible_agents: [claude-code, codex, cursor, workbuddy]
  content: |
    ---
    name: sql-helper
    description: 把自然语言需求转成 SQL，并能解释和优化已有查询
    ---

    # SQL Helper

    ## 何时使用
    用户描述想查的数据、或贴出一段 SQL 求解释/优化时。

    ## 做法
