# tokenbank.tools.default.yaml
# 工具清单默认配置 — 程序内置，首次初始化时加载到 config-loader。
# 用户通过「导入配置」（本地文件或服务器下发）覆盖后，此文件不再使用。
# 格式与 tokenbank.routes.default.yaml 相同（统一 schema），各取所需的段。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口；占位符 {REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口；占位符 {MITM}=host:mitm_port

mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA

# ── 支持的 CLI 工具（接入方式 + 检测方式）──────────────────────────────────────
tools:
  - id: claude-code
    name: Claude Code
    protocol: anthropic
    detect:
      command: claude
      version-arg: --version
      config-dirs: ['$CLAUDE_CONFIG_DIR', '~/.claude']
    strategy: base_url-env
    inject:
      env:
        ANTHROPIC_BASE_URL: http://{REVERSE}

  - id: codex
    name: Codex (CLI)
    protocol: responses
    detect:
      command: codex
      version-arg: --version
    strategy: config-file
    config-file: '{CODEX_HOME|~/.codex}/config.toml'
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.base_url: http://{REVERSE}/v1
      model_providers.tokenbank.wire_api: responses
    revert: state-precise

  - id: gemini-cli
    name: Gemini CLI
    protocol: gemini
    detect:
      command: gemini
      version-arg: --version
      config-dirs: ['~/.gemini']
    strategy: base_url-env
    inject:
      env:
        GEMINI_BASE_URL: http://{REVERSE}

  # ── 桌面 GUI 应用（Electron/Chromium）：走系统代理 + 系统信任库 ──
  # needs_ca=true：必须先把根 CA 装进系统信任库才能托管（MITM）
  - id: claude-desktop
    name: Claude Desktop
    protocol: anthropic
    type: gui
    needs_ca: true
    unsupported: true          # 实测：对 a-api.anthropic.com 做了证书锁定，无法 MITM
    detect:
      appx: Claude
    strategy: mitm-system
    mitm-domains: [api.anthropic.com, a-api.anthropic.com, claude.ai]
    note: 证书锁定，无法托管（应用拒绝自定义根证书）

  - id: codex-desktop
    name: Codex Desktop
    protocol: responses
    type: gui
    needs_ca: true
    unsupported: true          # 实测：网页流量可拦，但模型调用走内置 Rust 内核绕过代理
    detect:
      appx: OpenAI.Codex
    strategy: mitm-system
    mitm-domains: [chatgpt.com, ab.chatgpt.com, ws.chatgpt.com, chat.openai.com, api.openai.com]
    note: 模型调用走内置内核（绕过代理），无法 MITM 托管；用量已从会话文件自动统计

# ── API Key 应用添加方式（「添加应用」的预设）──
# inject: env = 写环境变量；config-file = 改工具配置文件。{BASE}=网关地址 {KEY}=应用 key
app_presets:
  - id: claude-code
    name: Claude Code
    icon: "🤖"
    request_format: anthropic
    inject: env
    env:
      ANTHROPIC_BASE_URL: "{BASE}"
      ANTHROPIC_AUTH_TOKEN: "{KEY}"
  - id: codex
    name: Codex CLI
    icon: "💻"
    request_format: openai
    inject: env
    env:
      OPENAI_BASE_URL: "{BASE}/v1"
      OPENAI_API_KEY: "{KEY}"
  - id: gemini-cli
    name: Gemini CLI
    icon: "🔮"
    request_format: openai
    inject: env
    env:
      GOOGLE_GEMINI_BASE_URL: "{BASE}"
      GEMINI_API_KEY: "{KEY}"
  - id: codex-desktop-api
    name: Codex Desktop (API)
    icon: "🖥️"
    request_format: openai
    inject: config-file
    config_file: "{CODEX_HOME|~/.codex}/config.toml"
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.name: Tokenbank
      model_providers.tokenbank.base_url: "{BASE}/v1"
      model_providers.tokenbank.wire_api: responses
      model_providers.tokenbank.env_key: TOKENBANK_API_KEY
    env:
      TOKENBANK_API_KEY: "{KEY}"
