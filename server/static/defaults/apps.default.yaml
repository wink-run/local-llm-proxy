# apps.default.yaml（服务端 canonical）
# 工具清单 + API Key 应用 + 个人页计费目录。
# 启动时若 config.apps 为空则自动种子写入 DB；客户端 GET /config/apps 同步到 ~/.tokenbank/tokenbank.yaml。
# 计费段须与 client/electron/config/tokenbank.tools.default.yaml 保持同步（离线回退）。
# 铁律：真 key / 真证书永不进此文件。

version: 1

gateway:
  host: 127.0.0.1
  reverse_port: 11430        # 反向代理端口；占位符 {REVERSE}=host:reverse_port
  mitm_port: 8888            # MITM proxy 端口；占位符 {MITM}=host:mitm_port

mitm:
  ca_ref:
    - file://{TOKENBANK_CA|}  # 用户显式指定 CA 路径（为空跳过）
    - auto                    # 回退：自动生成 name-constrained CA

# Claude 客户端模型名（内部透明：仅供 /v1/models 暴露 + 标记 Claude 请求；真实模型来自应用绑定）
claude_models:
  - claude-opus-4-8
  - claude-opus-4-6
  - claude-opus-4-5
  - claude-opus-4
  - claude-sonnet-4-6
  - claude-sonnet-4-5
  - claude-sonnet-4
  - claude-haiku-4-5

# ── 支持的 CLI 工具（接入方式 + 检测方式）──────────────────────────────────────
tools:
  - id: claude-code
    name: Claude Code
    route_bindable: true                    # 支持选择路由
    protocol: anthropic
    detect:
      command: claude
      version-arg: --version
      config-dirs: ['$CLAUDE_CONFIG_DIR', '~/.claude']
    strategy: base_url-env
    inject:
      env:
        ANTHROPIC_BASE_URL: http://{REVERSE}
        ANTHROPIC_AUTH_TOKEN: "{KEY}"

  # ── Codex CLI：认 OPENAI_BASE_URL/OPENAI_API_KEY，env 重定向到网关（无需证书）──
  - id: codex
    name: Codex (CLI)
    protocol: responses
    detect:
      command: codex
      version-arg: --version
    strategy: base_url-env
    inject:
      env:
        OPENAI_BASE_URL: http://{REVERSE}/v1
        OPENAI_API_KEY: "{KEY}"

  - id: gemini-cli
    name: Gemini CLI
    protocol: gemini
    detect:
      command: gemini
      version-arg: --version
      config-dirs: ['~/.gemini']
    strategy: base_url-env
    inject:
      env:
        GEMINI_BASE_URL: http://{REVERSE}
        GEMINI_API_KEY: "{KEY}"

  # ── OpenCode（sst/opencode）：认 OPENAI_BASE_URL/OPENAI_API_KEY，env 重定向（环境变量优先）──
  - id: opencode
    name: OpenCode
    protocol: openai
    detect:
      command: opencode
      version-arg: --version
      config-dirs: ['~/.config/opencode']
    strategy: base_url-env
    inject:
      env:
        OPENAI_BASE_URL: http://{REVERSE}/v1
        OPENAI_API_KEY: "{KEY}"

  # ── Hermes Agent（NousResearch）：认 OPENAI_BASE_URL/OPENAI_API_KEY，env 重定向 ──
  - id: hermes
    name: Hermes Agent
    protocol: openai
    detect:
      command: hermes
      version-arg: --version
      config-dirs: ['~/.hermes']
    strategy: base_url-env
    inject:
      env:
        OPENAI_BASE_URL: http://{REVERSE}/v1
        OPENAI_API_KEY: "{KEY}"


# ── API Key 应用（检测到已安装则在列表显示「添加」，写其配置文件指向网关）──
# {BASE}=网关地址 {KEY}=应用 key（运行时按应用填入；真 key 不进此文件）
api_key_apps:
  - id: claude-desktop
    name: Claude Desktop
    icon: "🖥️"
    appx: Claude
    config_file: "{CLAUDE_3P_CONFIG}"
    marker: tokenbank
    enable_3p: true                         # 是否启用 Claude Desktop 3p 接入（false 则不显示该应用）
    route_bindable: true
    allow_direct: false                     # 纳管时默认绑路由走网关（仍可手动切回直连官方）
    # 全部写进 JSON 配置文件（Claude Desktop 从 JSON 读 key，不读环境变量）。
    # 客户端写入时会再注入 inferenceModels（name 用 Anthropic 名过 Claude Desktop 校验，
    # labelOverride 显示绑定的路由名；keyScene 再把 claude-* 改写成该路由）+
    # coworkEgressAllowedHosts / disableDeploymentModeChooser，并去掉 modelDiscoveryEnabled。
    patch:
      inferenceProvider: gateway
      inferenceGatewayBaseUrl: "{BASE}"
      inferenceGatewayApiKey: "{KEY}"
      inferenceGatewayAuthScheme: bearer
      _configManagedBy: tokenbank

  - id: codex-desktop
    name: Codex Desktop
    icon: "🖥️"
    appx: OpenAI.Codex
    config_file: "{CODEX_HOME|~/.codex}/config.toml"
    marker: tokenbank
    route_bindable: true                    # Codex 支持模型改写
    allow_direct: false                     # 纳管时默认绑路由走网关（仍可手动切回直连官方）
    patch:
      model_provider: tokenbank
      model_providers.tokenbank.name: Tokenbank
      model_providers.tokenbank.base_url: "{BASE}/v1"
      model_providers.tokenbank.wire_api: responses
      model_providers.tokenbank.env_key: TOKENBANK_API_KEY
    env:
      TOKENBANK_API_KEY: "{KEY}"

  # ── OpenClaw：base_url 只能写配置文件（不认环境变量）→ 走 API Key 应用（命令检测，手动添加）──
  - id: openclaw
    name: OpenClaw
    icon: "🦞"
    command: openclaw                        # CLI 命令检测（非 appx 桌面包）
    config_file: "~/.openclaw/openclaw.json"
    marker: tokenbank
    route_bindable: true
    patch:
      models.providers.tokenbank.baseUrl: "{BASE}/v1"
      models.providers.tokenbank.apiKey: "{KEY}"
      models.providers.tokenbank.api: openai-completions

# ════════ 个人页：订阅账户 / 按量付费目录（与客户端 tokenbank.tools.default.yaml 同 schema）════════
# 管理员上传 config.apps 时一并下发；客户端 applyConfigDoc 写入 ~/.tokenbank/tokenbank.yaml

