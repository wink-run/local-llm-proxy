name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: tokenbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d tokenbank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://root:changeme@localhost:5432/tokenbank
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Client tests
        working-directory: client
        run: npm ci && npm test

      - name: Server tests
        working-directory: server
        run: pip install -r requirements.txt && python -m unittest discover -s . -p 'test_*.py' -v
