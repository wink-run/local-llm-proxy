name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/wink-run/local-llm-proxy/gateway

jobs:

  # ── macOS .dmg ───────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不使用 setup-node 内置 npm cache，避免 macOS runner 上出现 EEXIST 缓存冲突

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python setuptools (node-gyp needs distutils)
        run: pip install setuptools

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: client

      - name: Install dependencies
        working-directory: client
        env:
          # 每次 workflow 使用独立缓存目录，规避 ~/.npm/_cacache/tmp EEXIST
          npm_config_cache: /tmp/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}..."
            npm cache clean --force
            npm ci && exit 0
            echo "npm ci failed, retrying..."
            sleep 3
          done
          exit 1

      - name: Build (Vite + electron-builder)
        run: npm run build -- --publish never
        working-directory: client

      # Upload .dmg + latest-mac.yml (needed by electron-updater)
      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            client/dist-app/*.dmg
            client/dist-app/latest-mac.yml

  # ── Windows .exe ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python setuptools (node-gyp needs distutils, removed in Python 3.12+)
        run: pip install setuptools

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "$($env:GITHUB_REF_NAME -replace '^v','')" --no-git-tag-version
        working-directory: client

      - name: Install dependencies
        working-directory: client
        env:
          npm_config_cache: ${{ runner.temp }}\npm-cache-${{ github.run_id }}-${{ github.run_attempt }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "npm ci attempt $i..."
            npm cache clean --force
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm ci failed, retrying..."
            Start-Sleep -Seconds 3
          }
          exit 1

      - name: Build (Vite + electron-builder)
        run: npm run build -- --publish never
        working-directory: client

      # Upload .exe + latest.yml (needed by electron-updater on Windows)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            client/dist-app/*.exe
            client/dist-app/latest.yml

  # ── Docker image (ghcr.io) ───────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.cli
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-mac, build-windows, build-docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # Download each artifact into its own subdirectory to avoid merge conflicts
      - uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts/mac

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/win

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/mac/*.yml
            artifacts/win/*.exe
            artifacts/win/*.yml
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | macOS | `.dmg` | 双击安装，支持自动更新 |
            | Windows | `.exe` | NSIS 安装包，支持自动更新 |
            | Docker | 见下方 | 命令行/服务器无界面部署 |

            ## Docker 快速启动

            ```bash
            # 拉取镜像
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}

            # 准备配置
            mkdir -p gateway-data
            cat > gateway-data/local-config.json << 'EOF'
            {
              "cloud_config": { "url": "http://YOUR_BACKEND:8000", "token": "YOUR_P2P_KEY" },
              "scene_routes": [],
              "local_keys": []
            }
            EOF

            # 启动
            docker run -d \
              --name llm-gateway \
              -p 11430:11430 \
              -p 11431:11431 \
              -v ./gateway-data:/data/.llm-agent \
              ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Web UI: `http://localhost:11431`
            LLM 入口: `OPENAI_BASE_URL=http://localhost:11430/v1`
